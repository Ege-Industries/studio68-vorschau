<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Studio68 · Admin</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/favicon.svg">
<meta name="theme-color" content="#0b0b0c">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section class="login" id="login" hidden>
  <form class="login-box" id="loginForm">
    <div class="lg-logo">studio<i>.</i><b>68</b></div>
    <div class="mono lg-k">ADMIN // NUR FÜR DAS STUDIO-TEAM</div>
    <label class="fld"><span>Passwort</span><input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="b b-orange b-big" type="submit">Anmelden →</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="top-logo">studio<i>.</i><b>68</b> <span class="mono">ADMIN</span></div>
    <a class="top-l mono" href="../" target="_blank" rel="noopener">Seite ansehen ↗</a>
    <button class="top-l mono" id="logout">Abmelden</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-t="heute" class="on"><b>⚠</b>Ausfälle</button>
    <button data-t="plan"><b>▦</b>Plan</button>
    <button data-t="fotos"><b>▣</b>Fotos</button>
    <button data-t="anfragen"><b>✉</b>Anfragen<i id="newCount"></i></button>
    <button data-t="mehr"><b>☰</b>Mehr</button>
  </nav>

  <main class="main">
    <section class="pane on" id="p-heute"></section>
    <section class="pane" id="p-plan"></section>
    <section class="pane" id="p-fotos"></section>
    <section class="pane" id="p-anfragen"></section>
    <section class="pane" id="p-mehr"></section>
  </main>

  <div class="savebar" id="savebar">
    <span id="saveTxt">Ungespeicherte Änderungen</span>
    <button class="b b-ghost" id="undo">Verwerfen</button>
    <button class="b b-orange" id="save">Live schalten</button>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
